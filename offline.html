<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mr. Thomas' Academy — Offline Mode</title>
<meta name="theme-color" content="#0F2A52">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./offline.css">
</head>
<body>
<header class="topbar">
  <b>Mr. Thomas' Academy</b>
  <span id="statusPill" class="status-pill">…</span>
</header>
<main><div id="app"><div class="empty">Loading…</div></div></main>
<div id="toast" class="toast"></div>

<!-- Animated loading screen shown only on first paint, before the app takes over -->
<div id="splash" style="position:fixed;inset:0;background:#0F2A52;display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .4s">
  <img src="./icons/logo-mark.png" alt="" style="width:110px;animation:mtaPulse 1.4s ease-in-out infinite">
</div>
<style>@keyframes mtaPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}</style>
<script>window.addEventListener("load",()=>setTimeout(()=>{const s=document.getElementById("splash");if(s){s.style.opacity="0";setTimeout(()=>s.remove(),400)}},350));</script>

<script src="./config.js"></script>
<script src="./database.js"></script>
<script src="./sync.js"></script>
<script src="./assignments.js"></script>
<script src="./offline.js"></script>
</body>
</html>
