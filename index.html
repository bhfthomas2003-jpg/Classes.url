<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2A52">
<meta name="description" content="Mr. Thomas' Academy — Learn. Practice. Submit. Excel.">
<title>Mr. Thomas' Academy</title>
<style>
:root{--navy:#0F2A52;--gold:#F2A900;--green:#2F7D4F;--bg:#F5F7FA;--white:#fff;--ink:#172033;--muted:#64748b;--line:#dce3ec;--danger:#b42318;--shadow:0 8px 28px rgba(15,42,82,.09);--glow-a:#F2A900;--glow-b:#4FACFE;--glow-c:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{background:linear-gradient(135deg,var(--navy),#173d73);color:white;position:sticky;top:0;z-index:20}.topbar{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center}.crest{width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;margin:3px 0 0;opacity:.8}.iconbtn{border:1px solid #ffffff35;background:#ffffff12;color:white;border-radius:10px;padding:9px 11px}
main{max-width:1180px;margin:auto;padding:20px 14px 90px}.hero{background:linear-gradient(135deg,#fff,#eef4fb);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}.hero h2{margin:0;color:var(--navy);font-size:clamp(25px,6vw,42px)}.hero p{color:var(--muted);margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 12px;color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:14px;background:#f8fafc;border:1px solid var(--line)}.stat b{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;background:var(--navy);color:white}.btn.gold{background:var(--gold);color:var(--navy)}.btn.green{background:var(--green)}.btn.light{background:#edf2f7;color:var(--navy)}.btn.danger{background:#fee4e2;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 6px;color:#344054}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:white;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px #0f2a5214}textarea{min-height:100px;resize:vertical}.field{margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf2f7;color:var(--navy);font-size:11px;font-weight:800}.pill.green{background:#e7f5ec;color:#24613d}.pill.gold{background:#fff4d6}.pill.red{background:#fee4e2;color:#9d2118}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}a{color:#1456a0}.empty{text-align:center;padding:25px;color:var(--muted)}
.auth{max-width:520px;margin:30px auto}.auth .logo{text-align:center;margin-bottom:18px}.logo .photo-orb{margin-bottom:8px}.logo h2{margin:10px 0 4px;color:var(--navy)}.logo p{margin:0;color:var(--muted)}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30;padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom))}.navinner{width:min(760px,100%);display:flex;overflow:auto}.navitem{flex:1;min-width:74px;border:0;background:none;padding:7px 4px;color:var(--muted);font-size:10px}.navitem b{display:block;font-size:18px;margin-bottom:2px}.navitem.active{color:var(--navy);font-weight:800}
.toast{position:fixed;right:14px;top:75px;z-index:50;max-width:360px;background:var(--navy);color:white;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow)}.toast.err{background:var(--danger)}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff66;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}@keyframes spin{to{transform:rotate(360deg)}}.modal{position:fixed;inset:0;background:#0b173366;display:grid;place-items:center;z-index:40;padding:15px}.modal>div{background:white;border-radius:18px;max-width:650px;width:100%;max-height:90vh;overflow:auto;padding:20px}.photo{width:82px;height:82px;border-radius:50%;object-fit:cover;border:4px solid white;box-shadow:0 2px 12px #0002;background:#e8eef5}.teacher-photo{width:64px;height:64px;border-radius:50%;object-fit:cover}.filebox{border:1px dashed #9aabc0;border-radius:12px;padding:14px;background:#f8fafc}.danger-text{color:var(--danger)}
@media(max-width:760px){.col-8,.col-6,.col-4{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.hero{padding:18px}.topbar{padding:10px 12px}table{min-width:700px}.tablewrap{overflow:auto}}

/* ================= MODERN ANIMATED UPGRADE ================= */
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes floatSlow{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-34px) scale(1.06)}}
@keyframes spinGlow{to{transform:rotate(360deg)}}
@keyframes spinGlowRev{to{transform:rotate(-360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmerBar{0%{background-position:0% 0}100%{background-position:200% 0}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 16px 2px rgba(242,169,0,.45),0 0 32px 6px rgba(242,169,0,.18)}50%{box-shadow:0 0 24px 5px rgba(79,172,254,.5),0 0 46px 10px rgba(79,172,254,.22)}}
@keyframes lightning{0%,100%{opacity:.5;transform:scale(1)}45%{opacity:1;transform:scale(1.06)}50%{opacity:.35;transform:scale(1)}55%{opacity:.95;transform:scale(1.04)}}

body{position:relative;overflow-x:hidden;background:
  radial-gradient(circle at 12% 18%,rgba(242,169,0,.10),transparent 40%),
  radial-gradient(circle at 88% 12%,rgba(79,172,254,.12),transparent 45%),
  radial-gradient(circle at 50% 100%,rgba(139,92,246,.10),transparent 50%),
  var(--bg);
}
.bg-orb{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;opacity:.5}
.bg-orb.o1{width:320px;height:320px;background:radial-gradient(circle,var(--glow-a),transparent 70%);top:-90px;left:-70px;animation:floatSlow 15s ease-in-out infinite}
.bg-orb.o2{width:380px;height:380px;background:radial-gradient(circle,var(--glow-b),transparent 70%);bottom:-110px;right:-90px;animation:floatSlow 19s ease-in-out infinite reverse}
.bg-orb.o3{width:260px;height:260px;background:radial-gradient(circle,var(--glow-c),transparent 70%);top:45%;left:60%;animation:floatSlow 22s ease-in-out infinite}
header,main,nav.bottom,.modal{position:relative;z-index:1}

.card,.hero{position:relative;overflow:hidden;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;transition:transform .35s ease,box-shadow .35s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,42,82,.16),0 0 0 1px rgba(242,169,0,.10)}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--glow-a),var(--glow-b),var(--glow-c),var(--glow-a));background-size:250% 100%;animation:shimmerBar 5s linear infinite}

.btn{position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .3s ease;isolation:isolate}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:220% 100%;background-position:200% 0;transition:background-position .6s ease}
.btn:hover::after{background-position:-40% 0}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,42,82,.25)}
.btn.gold:hover{box-shadow:0 8px 22px rgba(242,169,0,.5)}
.btn.green:hover{box-shadow:0 8px 22px rgba(47,125,79,.4)}
.btn:active{transform:translateY(0)}

/* Circular glow / lightning photo card */
.photo-orb{position:relative;display:inline-grid;place-items:center;width:var(--orb,86px);height:var(--orb,86px);flex:none}
.photo-orb__ring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--glow-a),var(--glow-b),var(--glow-c),var(--gold),var(--glow-a));animation:spinGlow 4.5s linear infinite;filter:blur(1.5px)}
.photo-orb__ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--white)}
.photo-orb__glow{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,0,.5),transparent 70%);animation:lightning 2.4s ease-in-out infinite;filter:blur(7px)}
.photo-orb img,.photo-orb .initials{position:relative;z-index:2;width:calc(var(--orb,86px) - 10px);height:calc(var(--orb,86px) - 10px);border-radius:50%;object-fit:cover;border:3px solid white;box-shadow:0 4px 18px rgba(15,42,82,.28);animation:floatY 5s ease-in-out infinite}
.photo-orb .initials{display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#173d73);color:var(--gold);font-weight:900;font-size:calc(var(--orb,86px)*.32)}
.photo-orb.sm{--orb:44px}
.photo-orb.md{--orb:72px}
.photo-orb.lg{--orb:130px}
.teacher-card{display:flex;align-items:center;gap:16px}
.teacher-card h2,.teacher-card h3{margin:0}
.teacher-card p{margin:2px 0 0}

.crest{position:relative;animation:pulseGlow 3.2s ease-in-out infinite}
nav.bottom{backdrop-filter:blur(10px);background:rgba(255,255,255,.85)}
.navitem{transition:transform .2s ease,color .2s ease}
.navitem.active{transform:translateY(-2px)}
.navitem.active b{filter:drop-shadow(0 0 6px rgba(242,169,0,.6))}
.stat{transition:transform .3s ease,box-shadow .3s ease}
.stat:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(15,42,82,.14)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ===== Student dashboard: profile hero + subject cards ===== */
.student-hero{gap:22px}
.student-hero h2{font-size:clamp(22px,5vw,34px)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.info-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.info-item span{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info-item b{display:block;font-size:14px;color:var(--navy);margin-top:2px;word-break:break-word}
.section-title{margin:22px 4px 10px;color:var(--navy);font-size:18px}
.subject-card{cursor:pointer;color:#fff;border:0;padding:24px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%}
.subject-card.math{background:linear-gradient(135deg,#0F2A52,#2563c9)}
.subject-card.physics{background:linear-gradient(135deg,#5b21b6,#4FACFE)}
.subject-card .sym{font-size:54px;line-height:1;opacity:.95;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.subject-card h3{color:#fff;font-size:24px;margin:10px 0 4px}
.subject-card p{margin:0;opacity:.88;font-size:13px}
.subject-card .enter{margin-top:16px;align-self:flex-start;background:var(--gold);color:var(--navy);font-weight:800;border-radius:11px;padding:10px 16px;font-size:14px}
.subject-card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:560px){.student-hero{flex-direction:column;text-align:center}.info-grid{text-align:left}}
.owner-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.scope-note{margin-top:12px;padding:10px 12px;border-radius:12px;background:#e7f5ec;color:#24613d;font-size:13px;font-weight:600}
.row-item{padding:12px 0;border-bottom:1px solid var(--line)}
</style>
</head>

function api(action,data={},auth=true){if(APP_CONFIG.demoMode)return demoApi(action,data);if(!APP_CONFIG.googleAppsScriptUrl)throw Error("Google Apps Script URL is not configured.");return fetch(APP_CONFIG.googleAppsScriptUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data,token:auth?localStorage.getItem(KEY)||"":""})}).then(r=>r.json())}
function ok(x){if(!x.success)throw Error(x.error||"Request failed");return x.data}
function teacherOrb(size){const photo=APP_CONFIG.teacherPhoto;const inner=photo?`<img src="${photo}" alt="${esc(APP_CONFIG.teacherName)}">`:`<div class="initials">${esc((APP_CONFIG.teacherName||"T")[0])}</div>`;return `<div class="photo-orb ${size||""}"><div class="photo-orb__ring"></div><div class="photo-orb__glow"></div>${inner}</div>`}
function initHeader(){const b=$("#brandBox");if(b)b.innerHTML=`${teacherOrb("sm")}<div><h1>${esc(APP_CONFIG.academyName)}</h1><p>${esc(APP_CONFIG.tagline)}</p></div>`}
function setSession(u,role,token){state.user=u;state.role=role;if(token)localStorage.setItem(KEY,token);$("#header").classList.remove("hidden");$("#bottomNav").classList.remove("hidden");render();loadView()}
function logout(){localStorage.removeItem(KEY);state={user:null,role:null,view:"dashboard",data:{}};$("#header").classList.add("hidden");$("#bottomNav").classList.add("hidden");renderLogin()}

function checkPrivateOwnerRoute(){
  if(location.hash==="#owner"){
    $("#header").classList.add("hidden"); $("#bottomNav").classList.add("hidden");
    $("#app").innerHTML=`<section class="auth"><div class="logo">${teacherOrb("lg")}<h2>${esc(APP_CONFIG.academyName)}</h2><p>Private Owner Administration</p></div><div class="card"><div id="authBox"></div></div></section>`;
    showLogin("owner");
    return true;
  }
  return false;
}

function renderLogin(){ $("#header").classList.add("hidden");$("#bottomNav").classList.add("hidden");$("#app").innerHTML=`<section class="auth"><div class="logo">${teacherOrb("lg")}<h2>${esc(APP_CONFIG.academyName)}</h2><p>${esc(APP_CONFIG.tagline)}</p></div><div class="card"><div class="actions" style="margin-bottom:14px"><button class="btn" onclick="showLogin('student')">Student Login</button></div><div id="authBox"></div></div><div class="card teacher-card" style="margin-top:12px">${teacherOrb("md")}<div><b>${esc(APP_CONFIG.teacherName)}</b><p class="muted small">${esc(APP_CONFIG.teacherRole)}</p><p class="small muted">Grades 10–12 • Mathematics & Physics</p></div></div></section>`;showLogin("student")}
function showLogin(type){const b=$("#authBox");if(type==="student")b.innerHTML=`<h3>Student Login</h3><form onsubmit="studentLogin(event)"><div class="field"><label>Student ID</label><input id="sid" required placeholder="MTA-2026-0001"></div><div class="field"><label>Password</label><input id="spw" type="password" required></div><button class="btn" id="loginBtn">Log In</button></form><div class="actions" style="margin-top:12px"><button class="btn light" onclick="registerForm()">Create Student Account</button><button class="btn light" onclick="resetRequestForm()">Forgot Password?</button></div>`;else b.innerHTML=`<h3>Owner Login</h3><p class="muted small">Private administration access.</p><form onsubmit="ownerLogin(event)"><div class="field"><label>Owner email</label><input id="oemail" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="opw" type="password" required autocomplete="current-password"></div><button class="btn">Owner Login</button></form>`}
function registerForm(){modal(`<h3>Create Student Account</h3><form onsubmit="registerStudent(event)"><div class="formgrid"><div class="field full"><label>Full Name</label><input id="rname" required></div><div class="field"><label>Email</label><input id="remail" type="email" required></div><div class="field"><label>Phone (optional)</label><input id="rphone"></div><div class="field"><label>Grade</label><select id="rgrade" required><option value="">Select</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div class="field"><label>Section/Class</label><input id="rsection" required></div><div class="field full"><label>School</label><input id="rschool" required></div><div class="field"><label>Password</label><input id="rpw" type="password" minlength="8" required></div><div class="field"><label>Confirm Password</label><input id="rcpw" type="password" minlength="8" required></div><div class="field full filebox"><label>Profile Photo (optional)</label><input id="rphoto" type="file"></div></div><div class="actions"><button class="btn" id="regBtn">Create Account</button><button type="button" class="btn light" onclick="closeModal()">Cancel</button></div></form>`)}
function filePayload(file,maxMB){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(maxMB&&file.size>maxMB*1024*1024)return reject(new Error("File exceeds "+maxMB+" MB."));const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error("Could not read file."));reader.readAsDataURL(file)})}
async function registerStudent(e){e.preventDefault();if(rpw.value!==rcpw.value)return toast("Passwords do not match",true);const f=rphoto.files[0];const btn=$("#regBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Creating…';try{let photoData=null;if(f)photoData=await filePayload(f,APP_CONFIG.maxPhotoSizeMB);const d=ok(await api("registerStudent",{fullName:rname.value,email:remail.value,phone:rphone.value,grade:rgrade.value,section:rsection.value,school:rschool.value,password:rpw.value,confirmPassword:rcpw.value,photoData,fileName:f?f.name:"",fileType:f?f.type:""},false));closeModal();toast("Account created. Your Student ID is "+d.profile.studentId);setSession(d.profile,"student",d.token)}catch(x){toast(x.message,true)}finally{btn.disabled=false;btn.textContent="Create Account"}}
async function studentLogin(e){e.preventDefault();try{const d=ok(await api("loginStudent",{studentId:sid.value.trim(),password:spw.value},false));setSession(d.profile,"student",d.token)}catch(x){toast(x.message,true)}}
async function ownerLogin(e){e.preventDefault();try{const d=ok(await api("loginOwner",{email:document.getElementById("oemail").value.trim(),password:document.getElementById("opw").value},false));setSession(d.owner,"owner",d.token)}catch(x){toast(x.message,true)}}
function resetRequestForm(){modal(`<h3>Forgot Password</h3><p class="muted small">Enter your registered email. A reset link will be sent to it.</p><form onsubmit="requestReset(event)"><div class="field"><label>Registered email</label><input id="resetIdent" type="email" required></div><button class="btn">Send Reset Link</button></form>`)}
async function requestReset(e){e.preventDefault();try{ok(await api("requestPasswordReset",{email:resetIdent.value.trim()},false));closeModal();toast("If the account exists, a reset email has been sent.")}catch(x){toast(x.message,true)}}
function render(){if(!state.user){if(checkPrivateOwnerRoute())return;return renderLogin();}const nav=state.role==="owner"?["dashboard","students","assignments","submissions","resources","announcements","grades","courses","feedback"]:["dashboard","assignments","practice","resources","courses","grades","announcements","feedback","profile"];$("#navInner").innerHTML=nav.map(v=>`<button class="navitem ${(state.view===v||(v==="dashboard"&&(state.view==="subject"||state.view==="class")))?"active":""}" onclick="go('${v}')"><b>${({dashboard:"⌂",students:"♟",assignments:"▣",submissions:"↥",resources:"▤",practice:"✦",grades:"✓",announcements:"!",courses:"◫",feedback:"✎",profile:"●"})[v]}</b>${v[0].toUpperCase()+v.slice(1)}</button>`).join("");const page=state.role==="owner"?ownerPage():studentPage();$("#app").innerHTML=page}
function go(v){state.view=v;render();loadView()}
async function loadView(){try{if(state.role==="student"){if(state.view==="dashboard")state.data=ok(await api("getStudentDashboard",{studentId:state.user.studentId}));else if(state.view==="subject"){state.data.assignments=(ok(await api("getAssignments",{grade:state.user.grade}))||{}).assignments||[];state.data.resources=(ok(await api("getResources",{grade:state.user.grade}))||{}).resources||[]}else if(state.view==="assignments")state.data.assignments=(ok(await api("getAssignments",{grade:state.user.grade}))||{}).assignments;else if(["resources","practice"].includes(state.view)){const rlist=(ok(await api("getResources",{grade:state.user.grade}))||{}).resources||[];state.data.resources=state.view==="practice"?rlist.filter(r=>String(r.category)==="Practice"):rlist;}else if(state.view==="grades")state.data.grades=(ok(await api("getGrades",{studentId:state.user.studentId}))||{}).grades;else if(state.view==="courses")state.data.courses=(ok(await api("getCourses",{}))||{}).courses||[];else if(state.view==="announcements")state.data.announcements=(ok(await api("getAnnouncements",{grade:state.user.grade}))||{}).announcements;else if(state.view==="profile")state.data.profile=(ok(await api("getStudent",{studentId:state.user.studentId}))||{}).profile;}else{
  const b=ok(await api("getOwnerBundle"));
  state.data=state.data||{};
  state.data.stats=b.stats; state.data.students=b.students; state.data.assignments=b.assignments;
  state.data.submissions=b.submissions; state.data.grades=b.grades; state.data.resources=b.resources;
  state.data.announcements=b.announcements; state.data.courses=b.courses; state.data.logs=b.logs; state.data.feedback=b.feedback;
}render()}catch(x){toast(x.message,true)}}
function studentPage(){if(state.view==="dashboard")return studentDashboard();if(state.view==="subject")return studentSubject();if(state.view==="assignments")return studentAssignments();if(state.view==="resources"||state.view==="practice")return studentResources();if(state.view==="courses")return studentCourses();if(state.view==="grades")return studentGrades();if(state.view==="announcements")return studentAnnouncements();if(state.view==="feedback")return studentFeedback();if(state.view==="profile")return profilePage();return `<div class="card">Select a section.</div>`}
function studentCourses(){const arr=state.data.courses||[];return `<div class="hero"><h2>My Courses</h2><p>Courses for ${esc(gradeLabel(state.user.grade))}.</p></div><div class="grid">${arr.length?arr.map(x=>`<div class="col-6"><div class="card"><span class="pill">${esc(x.subject)}</span><h3>${esc(x.courseName)}</h3><p class="muted small">${esc(x.description)}</p></div></div>`).join(""):`<div class="col-12"><div class="card empty">No courses have been added for your grade yet.</div></div>`}</div>`}
function studentFeedback(){return `<div class="hero"><h2>Comments & Feedback</h2><p>Share a comment, question, or suggestion with ${esc(APP_CONFIG.teacherName)}. Your message goes straight to the owner dashboard.</p></div><div class="card"><form onsubmit="sendFeedback(event)"><div class="field"><label>Your message</label><textarea id="fbMessage" required maxlength="2000" placeholder="Type your comment or feedback here…"></textarea></div><button class="btn green" id="fbBtn">Send Feedback</button></form></div>`}
async function sendFeedback(e){e.preventDefault();const msg=$("#fbMessage").value.trim();if(!msg)return toast("Please enter a message",true);const btn=$("#fbBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Sending…';try{ok(await api("submitFeedback",{message:msg}));$("#fbMessage").value="";toast("Thank you — your feedback has been sent.")}catch(x){toast(x.message,true)}finally{btn.disabled=false;btn.textContent="Send Feedback"}}
function studentOrb(p,size){const name=(p&&p.fullName)||"S";const initials=`<div class="initials">${esc(name[0].toUpperCase())}</div>`;const inner=p&&p.photoUrl?`<img src="${esc(p.photoUrl)}" alt="${esc(name)}" onerror="this.outerHTML='<div class=\\'initials\\'>${esc(name[0].toUpperCase())}</div>'">`:initials;return `<div class="photo-orb ${size||""}"><div class="photo-orb__ring"></div><div class="photo-orb__glow"></div>${inner}</div>`}
function infoItem(l,v){return `<div class="info-item"><span>${esc(l)}</span><b>${esc(v||"—")}</b></div>`}
const SUBJECTS={Mathematics:{cls:"math",sym:"∑",blurb:"Algebra, calculus, geometry and problem solving."},Physics:{cls:"physics",sym:"⚛",blurb:"Mechanics, waves, electricity and modern physics."}};
function subjectCard(name){const x=SUBJECTS[name];return `<div class="col-6"><button class="card subject-card ${x.cls}" onclick="openSubject('${name}')" aria-label="Enter ${name}"><div><div class="sym">${x.sym}</div><h3>${name}</h3><p>${x.blurb}</p></div><span class="enter">Enter ${name} →</span></button></div>`}
function openSubject(name){state.subject=name;go("subject")}
function sameSubject(a,b){return String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase()}
function studentSubject(){const sub=state.subject||"Mathematics";const x=SUBJECTS[sub]||SUBJECTS.Mathematics;const asg=(state.data.assignments||[]).filter(a=>sameSubject(a.subject,sub));const res=(state.data.resources||[]).filter(r=>sameSubject(r.subject,sub));return `<div class="hero"><button class="btn light" onclick="go('dashboard')" style="margin-bottom:12px">← Back to Dashboard</button><h2>${x.sym} ${esc(sub)}</h2><p>${esc(gradeLabel(state.user.grade))} • ${esc(x.blurb)}</p></div><div class="grid"><div class="col-6"><div class="card"><h3>Assignments</h3>${assignmentList(asg,true)}</div></div><div class="col-6"><div class="card"><h3>Learning Resources</h3>${res.length?res.map(r=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><span class="pill">${esc(r.category)}</span> <b>${esc(r.title)}</b><div class="small muted">${esc(r.description)}</div><div class="actions" style="margin-top:7px"><a class="btn light" href="${esc(r.fileUrl)}" target="_blank">Open file</a></div></div>`).join(""):`<div class="empty">No ${esc(sub)} resources yet.</div>`}</div></div></div>`}
function studentDashboard(){const d=state.data||{};const p=d.profile||state.user;return `<div class="hero teacher-card student-hero">${studentOrb(p,"lg")}<div style="flex:1;min-width:0"><h2>Welcome, ${esc(p.fullName)}</h2><div class="info-grid">${infoItem("School",p.school)}${infoItem("Class",p.section)}${infoItem("Grade",gradeLabel(p.grade))}${infoItem("Student ID",p.studentId)}</div></div></div><h3 class="section-title">Choose your subject</h3><div class="grid">${subjectCard("Mathematics")}${subjectCard("Physics")}</div><h3 class="section-title">My progress</h3><div class="grid"><div class="col-12"><div class="card"><div class="stats">${stat("Assignments",d.stats?.assignments||0)}${stat("Pending",d.stats?.pending||0)}${stat("Submitted",d.stats?.submitted||0)}${stat("Graded",d.stats?.graded||0)}</div></div></div><div class="col-8"><div class="card"><h3>Recent Assignments</h3>${assignmentList(d.assignments||[],true)}</div></div><div class="col-4"><div class="card"><h3>Recent Grades</h3>${gradeList(d.grades||[])}</div></div></div>`}
function stat(a,b){return `<div class="stat"><b>${esc(b)}</b><span>${esc(a)}</span></div>`}
function assignmentList(a,withSubmit=false){if(!a.length)return `<div class="empty">No assignments found.</div>`;return a.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(x.title)}</b> <span class="pill">${esc(x.subject)}</span><div class="small muted">${esc(x.grade)} • Due ${esc(x.dueDate||"—")}</div><div class="actions" style="margin-top:7px"><button class="btn light" onclick="viewAssignment('${esc(x.assignmentId)}')">View</button>${withSubmit&&!x.submitted?`<button class="btn green" onclick="submitForm('${esc(x.assignmentId)}')">Submit</button>`:""}${x.submitted?`<span class="pill green">Submitted</span>`:""}</div></div>`).join("")}
function gradeList(a){if(!a.length)return `<div class="empty">No grades yet.</div>`;return a.slice(0,5).map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x.score)}/${esc(x.maxScore)}</b> <span class="pill">${esc(x.percentage)}%</span><div class="small muted">${esc(x.assignmentTitle||x.assignmentId)}</div></div>`).join("")}
async function viewAssignment(id){try{const x=(ok(await api("getAssignment",{assignmentId:id}))||{}).assignment||{};modal(`<h3>${esc(x.title)}</h3><p><span class="pill">${esc(x.subject)}</span> <span class="pill">${esc(x.grade)}</span></p><p>${esc(x.description)}</p><h4>Instructions</h4><p>${esc(x.instructions)}</p><p class="small muted">Posted: ${esc(x.postedDate)} • Due: ${esc(x.dueDate)} • Max score: ${esc(x.maxScore)}</p>${x.attachmentUrl?`<a class="btn light" href="${esc(x.attachmentUrl)}" target="_blank">Open attachment</a>`:""}<div style="margin-top:15px"><button class="btn green" onclick="closeModal();submitForm('${esc(id)}')">Submit assignment</button></div>`)}catch(e){toast(e.message,true)}}
function submitForm(id){modal(`<h3>Submit Assignment</h3><div class="filebox"><label>File (maximum ${APP_CONFIG.maxFileSizeMB} MB)</label><input id="subFile" type="file"></div><p id="subInfo" class="small muted"></p><button class="btn green" id="subBtn" onclick="submitAssignment('${esc(id)}')">Upload & Submit</button>`);$("#subFile").onchange=()=>$("#subInfo").textContent=$("#subFile").files[0]?`${$("#subFile").files[0].name} • ${fmt($("#subFile").files[0].size)}`:""}
async function submitAssignment(id){const f=$("#subFile").files[0];if(!f)return toast("Select a file",true);if(f.size>APP_CONFIG.maxFileSizeMB*1024*1024)return toast("File exceeds 20 MB",true);try{$("#subBtn").disabled=true;const fileData=await filePayload(f,APP_CONFIG.maxFileSizeMB);ok(await api("submitAssignment",{assignmentId:id,fileData,fileName:f.name,fileType:f.type}));closeModal();toast("Assignment submitted");loadView()}catch(e){toast(e.message,true)}}
function studentAssignments(){return `<div class="hero"><h2>Assignments</h2><p>Assignments for ${esc(gradeLabel(state.user.grade))}.</p></div><div class="card">${assignmentList(state.data.assignments||[],true)}</div>`}
function studentResources(){const arr=state.data.resources||[];return `<div class="hero"><h2>${state.view==="practice"?"Practice Center":"Learning Resources"}</h2><p>Mathematics and Physics materials for ${esc(gradeLabel(state.user.grade))}.</p></div><div class="grid">${arr.length?arr.map(x=>`<div class="col-6"><div class="card"><span class="pill">${esc(x.category)}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description)}</p><p class="small">${esc(x.subject)} • ${esc(x.grade)}</p><a class="btn light" href="${esc(x.fileUrl)}" target="_blank">Open file</a></div></div>`).join(""):`<div class="col-12"><div class="card empty">No resources available.</div></div>`}</div>`}
function studentGrades(){return `<div class="hero"><h2>My Grades</h2></div><div class="card tablewrap"><table><thead><tr><th>Assignment</th><th>Score</th><th>Percent</th><th>Feedback</th><th>Date</th></tr></thead><tbody>${(state.data.grades||[]).map(x=>`<tr><td>${esc(x.assignmentTitle||x.assignmentId)}</td><td>${esc(x.score)}/${esc(x.maxScore)}</td><td>${esc(x.percentage)}%</td><td>${esc(x.feedback)}</td><td>${esc(x.gradedAt)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No grades yet.</td></tr>`}</tbody></table></div>`}
function studentAnnouncements(){return `<div class="hero"><h2>Announcements</h2></div><div class="grid">${(state.data.announcements||[]).map(x=>`<div class="col-6"><div class="card"><span class="pill">${esc(x.audience)}</span><h3>${esc(x.title)}</h3><p>${esc(x.message)}</p><small class="muted">${esc(x.publishedAt)}</small></div></div>`).join("")||`<div class="col-12"><div class="card empty">No announcements.</div></div>`}</div>`}
function profilePage(){const p=state.data.profile||state.user;return `<div class="hero"><h2>My Profile</h2></div><div class="card"><div style="display:flex;gap:15px;align-items:center;margin-bottom:18px">${p.photoUrl?`<img class="photo" src="${esc(p.photoUrl)}">`:`<div class="photo" style="display:grid;place-items:center;color:var(--navy);font-weight:900">${esc((p.fullName||"S")[0])}</div>`}<div><h3>${esc(p.fullName)}</h3><span class="pill">${esc(p.studentId)}</span></div></div><div class="formgrid"><p><b>Grade</b><br>${esc(gradeLabel(p.grade))}</p><p><b>Section</b><br>${esc(p.section)}</p><p><b>School</b><br>${esc(p.school)}</p><p><b>Email</b><br>${esc(p.email)}</p><p><b>Phone</b><br>${esc(p.phone||"—")}</p><p><b>Status</b><br>${esc(p.status)}</p></div><div class="filebox"><label>Change profile photo</label><input id="newPhoto" type="file" onchange="uploadPhoto()"></div></div>`}
async function uploadPhoto(){const f=$("#newPhoto").files[0];if(!f)return;try{ok(await api("saveStudentPhoto",{photoData:await filePayload(f,APP_CONFIG.maxPhotoSizeMB),fileName:f.name,fileType:f.type}));toast("Profile photo updated");loadView()}catch(e){toast(e.message,true)}}
function ownerPage(){if(state.view==="dashboard")return ownerDashboard();if(state.view==="class")return ownerClass();if(state.view==="students")return ownerStudents();if(state.view==="assignments")return ownerAssignments();if(state.view==="submissions")return ownerSubmissions();if(state.view==="resources")return ownerResources();if(state.view==="announcements")return ownerAnnouncements();if(state.view==="grades")return ownerGrades();if(state.view==="courses")return ownerCourses();if(state.view==="feedback")return ownerFeedback()}
function ownerFeedback(){const arr=state.data.feedback||[];return `<div class="hero"><h2>Student Feedback</h2><p>Comments and feedback submitted by students.</p></div><div class="grid">${arr.length?arr.map(x=>`<div class="col-6"><div class="card"><span class="pill">${esc(x.studentName)} • Grade ${esc(x.grade)}</span><p style="margin-top:8px">${esc(x.message)}</p><div class="actions" style="margin-top:10px"><small class="muted">${esc(x.submittedAt)}</small><button class="btn danger" onclick="removeFeedback('${esc(x.feedbackId)}')">Delete</button></div></div></div>`).join(""):`<div class="col-12"><div class="card empty">No feedback submitted yet.</div></div>`}</div>`}
async function removeFeedback(id){try{ok(await api("deleteFeedback",{feedbackId:id}));toast("Feedback removed");loadView()}catch(e){toast(e.message,true)}}

const GRADES=["10","11","12"],SUBJ=["Mathematics","Physics"];
function gnum(g){return String(g??"").replace(/grade/ig,"").trim()}
function gradeLabel(g){const n=gnum(g);return n?"Grade "+n:""}
function plural(n,w){return n+" "+w+(n===1?"":"s")}
function inClass(o,g,sub){return gnum(o.grade)===g&&sameSubject(o.subject,sub)}
function ownerDashboard(){const d=state.data||{};const s=d.stats||{};const stu=d.students||[];
const classes=GRADES.map(g=>{const n=stu.filter(x=>gnum(x.grade)===g).length;return `<h3 class="section-title">${gradeLabel(g)} <span class="pill">${plural(n,"student")}</span></h3><div class="grid">${SUBJ.map(sub=>{const x=SUBJECTS[sub];const a=(d.assignments||[]).filter(o=>inClass(o,g,sub)).length;const r=(d.resources||[]).filter(o=>inClass(o,g,sub)).length;return `<div class="col-6"><button class="card subject-card ${x.cls}" onclick="openClass('${g}','${sub}')" aria-label="Manage ${gradeLabel(g)} ${sub}"><div><div class="sym">${x.sym}</div><h3>${gradeLabel(g)} • ${sub}</h3><p>${plural(a,"assignment")} • ${plural(r,"resource")}</p></div><span class="enter">Manage →</span></button></div>`}).join("")}</div>`}).join("");
return `<div class="hero teacher-card">${teacherOrb("lg")}<div><h2>Welcome back, ${esc(APP_CONFIG.teacherName)}</h2><p>${esc(APP_CONFIG.teacherRole)} • Full administration of ${esc(APP_CONFIG.academyName)}</p></div></div><h3 class="section-title">Your classes</h3><p class="muted small" style="margin:-4px 4px 0">Open a class to upload assignments and resources. Each upload is visible only to students of that grade.</p>${classes}<h3 class="section-title">Overview</h3><div class="card"><div class="stats">${stat("Total Students",s.totalStudents||0)}${stat("Grade 10",s.grade10||0)}${stat("Grade 11",s.grade11||0)}${stat("Grade 12",s.grade12||0)}</div><div class="stats" style="margin-top:10px">${stat("Active Assignments",s.activeAssignments||0)}${stat("Pending Submissions",s.pendingSubmissions||0)}${stat("Graded",s.gradedSubmissions||0)}${stat("Courses",s.courses||0)}</div></div>`}
function openClass(g,sub){state.cg=g;state.cs=sub;go("class")}
function ownerClass(){const g=state.cg||"10",sub=state.cs||"Mathematics",x=SUBJECTS[sub];const d=state.data||{};const asg=(d.assignments||[]).filter(o=>inClass(o,g,sub));const res=(d.resources||[]).filter(o=>inClass(o,g,sub));const n=(d.students||[]).filter(o=>gnum(o.grade)===g).length;
return `<div class="hero"><button class="btn light" onclick="go('dashboard')" style="margin-bottom:12px">← All classes</button><h2>${x.sym} ${gradeLabel(g)} • ${sub}</h2><p>${plural(n,"student")} enrolled</p><div class="scope-note">Anything uploaded here is visible only to ${gradeLabel(g)} students. Other grades cannot see or open it.</div><div class="owner-actions"><button class="btn gold" onclick="assignmentForm('${g}','${sub}')">+ New Assignment</button><button class="btn green" onclick="resourceForm('${g}','${sub}')">+ Upload Resource</button></div></div><div class="grid"><div class="col-6"><div class="card"><h3>Assignments (${asg.length})</h3>${asg.length?asg.map(a=>`<div class="row-item"><b>${esc(a.title)}</b><div class="small muted">Due ${esc(a.dueDate||"—")} • Max ${esc(a.maxScore)}</div><div class="actions" style="margin-top:7px"><button class="btn danger" onclick="ownerDelete('deleteAssignment',{assignmentId:'${esc(a.assignmentId)}'})">Delete</button></div></div>`).join(""):`<div class="empty">No ${sub} assignments for ${gradeLabel(g)} yet.</div>`}</div></div><div class="col-6"><div class="card"><h3>Resources (${res.length})</h3>${res.length?res.map(r=>`<div class="row-item"><span class="pill">${esc(r.category)}</span> <b>${esc(r.title)}</b><div class="small muted">${esc(r.description)}</div><div class="actions" style="margin-top:7px"><a class="btn light" href="${esc(r.fileUrl)}" target="_blank">Open file</a><button class="btn danger" onclick="ownerDelete('deleteResource',{resourceId:'${esc(r.resourceId)}'})">Delete</button></div></div>`).join(""):`<div class="empty">No ${sub} resources for ${gradeLabel(g)} yet.</div>`}</div></div></div>`}
function gsFields(g,sub){return `<div class="field"><label>Grade (class)</label><select id="fGrade" required onchange="gsHint()"><option value="">Select</option>${GRADES.map(x=>`<option value="${x}" ${x===g?"selected":""}>${gradeLabel(x)}</option>`).join("")}</select></div><div class="field"><label>Subject</label><select id="fSubject" required onchange="gsHint()"><option value="">Select</option>${SUBJ.map(x=>`<option ${x===sub?"selected":""}>${x}</option>`).join("")}</select></div><div class="full scope-note" id="gsHint"></div>`}
function gsHint(){const g=$("#fGrade").value,s=$("#fSubject").value;$("#gsHint").textContent=g&&s?`Only ${gradeLabel(g)} students will see this ${s} item.`:"Choose the grade and subject this is for."}
function assignmentForm(g,sub){modal(`<h3>New Assignment</h3><form onsubmit="saveAssignment(event)"><div class="formgrid">${gsFields(g,sub)}<div class="field full"><label>Title</label><input id="fTitle" required></div><div class="field full"><label>Description</label><textarea id="fDesc"></textarea></div><div class="field full"><label>Instructions</label><textarea id="fInstr"></textarea></div><div class="field"><label>Due date</label><input id="fDue" type="date"></div><div class="field"><label>Maximum score</label><input id="fMax" type="number" min="1" value="100"></div><div class="field full filebox"><label>Attachment (optional, max ${APP_CONFIG.maxFileSizeMB} MB)</label><input id="fFile" type="file"></div></div><div class="actions"><button class="btn gold" id="fBtn">Publish Assignment</button><button type="button" class="btn light" onclick="closeModal()">Cancel</button></div></form>`);gsHint()}
async function saveAssignment(e){e.preventDefault();const btn=$("#fBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Publishing…';try{const f=$("#fFile").files[0];const att=f?await filePayload(f,APP_CONFIG.maxFileSizeMB):null;const g=$("#fGrade").value;ok(await api("createAssignment",{title:$("#fTitle").value.trim(),subject:$("#fSubject").value,grade:g,description:$("#fDesc").value,instructions:$("#fInstr").value,dueDate:$("#fDue").value,maxScore:$("#fMax").value||100,attachmentData:att,attachmentName:f?f.name:"",attachmentType:f?f.type:""}));closeModal();toast("Assignment published to "+gradeLabel(g));loadView()}catch(x){toast(x.message,true);btn.disabled=false;btn.textContent="Publish Assignment"}}
function resourceForm(g,sub){modal(`<h3>Upload Resource</h3><form onsubmit="saveResource(event)"><div class="formgrid">${gsFields(g,sub)}<div class="field full"><label>Title</label><input id="fTitle" required></div><div class="field"><label>Type</label><select id="fCat"><option>Learning Resource</option><option>Practice</option><option>Notes</option></select></div><div class="field full"><label>Description</label><textarea id="fDesc"></textarea></div><div class="field full filebox"><label>File (required, max ${APP_CONFIG.maxFileSizeMB} MB)</label><input id="fFile" type="file" required></div></div><div class="actions"><button class="btn green" id="fBtn">Upload Resource</button><button type="button" class="btn light" onclick="closeModal()">Cancel</button></div></form>`);gsHint()}
async function saveResource(e){e.preventDefault();const btn=$("#fBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Uploading…';try{const f=$("#fFile").files[0];if(!f)throw new Error("Select a file");const fileData=await filePayload(f,APP_CONFIG.maxFileSizeMB);const g=$("#fGrade").value;ok(await api("uploadTeacherResource",{title:$("#fTitle").value.trim(),subject:$("#fSubject").value,grade:g,category:$("#fCat").value,description:$("#fDesc").value,fileData,fileName:f.name,fileType:f.type}));closeModal();toast("Resource uploaded to "+gradeLabel(g));loadView()}catch(x){toast(x.message,true);btn.disabled=false;btn.textContent="Upload Resource"}}
function ownerResources(){const arr=(state.data.resources||[]).slice().sort((a,b)=>gnum(a.grade).localeCompare(gnum(b.grade))||String(a.subject).localeCompare(String(b.subject)));return `<div class="hero"><h2>Resources</h2><p>All uploaded materials, by grade.</p><div class="owner-actions"><button class="btn green" onclick="resourceForm()">+ Upload Resource</button></div></div><div class="card tablewrap"><table><thead><tr><th>Grade</th><th>Subject</th><th>Title</th><th>Type</th><th>Actions</th></tr></thead><tbody>${arr.map(r=>`<tr><td>${esc(gradeLabel(r.grade))}</td><td>${esc(r.subject)}</td><td>${esc(r.title)}</td><td>${esc(r.category)}</td><td><a class="btn light" href="${esc(r.fileUrl)}" target="_blank">Open</a> <button class="btn danger" onclick="ownerDelete('deleteResource',{resourceId:'${esc(r.resourceId)}'})">Delete</button></td></tr>`).join("")||`<tr><td colspan="5" class="empty">No resources uploaded yet.</td></tr>`}</tbody></table></div>`}
async function ownerDelete(action,params){if(!confirm("Delete this permanently? This cannot be undone."))return;try{ok(await api(action,params));toast("Deleted");loadView()}catch(e){toast(e.message,true)}}
async function studentStatus(id,action){try{ok(await api(action,{studentId:id}));toast("Student updated");loadView()}catch(e){toast(e.message,true)}}

function ownerStudents(){return `<div class="hero"><h2>Students</h2><button class="btn light" onclick="loadView()">Refresh</button></div><div class="card tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Grade</th><th>School</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody>${(state.data.students||[]).map(x=>`<tr><td>${esc(x.studentId)}</td><td>${esc(x.fullName)}</td><td>${esc(x.grade)}</td><td>${esc(x.school)}</td><td>${esc(x.email)}</td><td>${esc(x.status)}</td><td>${x.status==="Active"?`<button class="btn danger" onclick="studentStatus('${esc(x.studentId)}','suspendStudent')">Suspend</button>`:`<button class="btn green" onclick="studentStatus('${esc(x.studentId)}','reactivateStudent')">Reactivate</button>`}<button class="btn danger" style="margin-left:5px" onclick="ownerDelete('deleteStudent',{studentId:'${esc(x.studentId)}'})">Delete</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No students.</td></tr>`}</tbody></table></div>`}

function ownerAssignments(){return `<div class="hero"><h2>Assignments</h2><button class="btn gold" onclick="assignmentForm()">+ New Assignment</button></div><div class="grid">${(state.data.assignments||[]).map(x=>`<div class="col-6"><div class="card"><span class="pill">${esc(x.subject)} • Grade ${esc(x.grade)}</span><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><small>Due: ${esc(x.dueDate||"No due date")} • Max: ${esc(x.maxScore)}</small><div class="actions" style="margin-top:10px"><button class="btn danger" onclick="ownerDelete('deleteAssignment',{assignmentId:'${esc(x.assignmentId)}'})">Delete</button></div></div></div>`).join("")||`<div class="col-12"><div class="card empty">No assignments.</div></div>`}</div>`}

function demoApi(action,d){return new Promise(resolve=>{let x={success:true,data:{}};if(action==="registerStudent"){x.data.profile={studentId:"MTA-2026-0002",fullName:d.fullName,email:d.email,phone:d.phone,grade:d.grade,section:d.section,school:d.school,status:"Active",photoUrl:""};x.data.token="demo-token"}else if(action==="loginStudent"){x.data.profile=DEMO.students[0];x.data.token="demo-token"}else if(action==="loginOwner"){x.data.owner={email:"owner",name:"Mr. Thomas",role:"Owner / Administrator"};x.data.token="demo-teacher"}else if(action==="getStudentDashboard"){x.data={stats:{assignments:2,pending:1,submitted:1,graded:1},assignments:DEMO.assignments,grades:DEMO.grades}}else if(action==="getAssignments")x.data={assignments:DEMO.assignments};else if(action==="getResources")x.data={resources:DEMO.resources};else if(action==="getAnnouncements")x.data={announcements:DEMO.announcements};else if(action==="getGrades")x.data={grades:DEMO.grades};else if(action==="getStudent")x.data={profile:DEMO.students[0]};else if(action==="getAssignment")x.data={assignment:DEMO.assignments.find(a=>a.assignmentId===d.assignmentId)||DEMO.assignments[0]};else if(action==="ownerStats")x.data={totalStudents:18,grade10:6,grade11:7,grade12:5,activeAssignments:8,pendingSubmissions:12,gradedSubmissions:31,courses:6};else if(action==="getStudents")x.data=DEMO.students;else if(action==="getSubmissions")x.data=[];else if(action==="getCourses")x.data=[{courseId:"C1",courseName:"Grade 11 Mathematics",subject:"Mathematics",grade:"Grade 11",description:"Core mathematics."},{courseId:"C2",courseName:"Grade 11 Physics",subject:"Physics",grade:"Grade 11",description:"Core physics."}];resolve(x)})}
function checkResetHash(){const h=location.hash;if(h.startsWith("#reset=")){const [token,studentId]=h.slice(7).split("&studentId=");modal(`<h3>Reset Password</h3><form onsubmit="resetPassword(event,'${esc(token)}','${esc(studentId||"")}')"><div class="field"><label>New password</label><input id="newpw" type="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input id="newcpw" type="password" minlength="8" required></div><button class="btn">Set New Password</button></form>`)}}
async function resetPassword(e,token,studentId){e.preventDefault();if(newpw.value!==newcpw.value)return toast("Passwords do not match",true);try{ok(await api("resetPassword",{token,studentId,password:newpw.value},false));closeModal();history.replaceState(null,"",location.pathname);toast("Password changed. You can now log in.")}catch(x){toast(x.message,true)}}
window.addEventListener("load",()=>{initHeader();render();checkResetHash();});
window.addEventListener("hashchange",()=>{if(!state.user){render();checkResetHash();}});
</script>

</body></html>
